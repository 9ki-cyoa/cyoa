<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143e62" />
    <meta
      name="description"
      content="판타지 세계를 여행하는 CYOA 게임의 타이틀 화면"
    />
    <title>심역록</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23102f4c' d='M7 8h50v48H7z'/%3E%3Cpath fill='%23f6d48c' d='M32 8 39 25l17 7-17 7-7 17-7-17-17-7 17-7z'/%3E%3C/svg%3E"
    />
    <link rel="preload" as="image" href="./assets/images/title-screen.png" />
    <link
      rel="preload"
      as="audio"
      type="audio/mpeg"
      href="https://raw.githubusercontent.com/9ki-cyoa/cyoa/main/media/title-bgm.mp3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css?v=20261001-1" />
  </head>
  <body>
    <main class="game-root">
      <section class="screen loading-screen" data-screen="loading" aria-label="게임 불러오는 중">
        <div class="loading-emblem" aria-hidden="true">
          <span></span>
        </div>

        <div class="loading-content">
          <p class="loading-title">심역록</p>
          <div
            class="loading-track"
            role="progressbar"
            aria-label="게임 자료 불러오기"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span class="loading-bar"></span>
          </div>
          <div class="loading-meta">
            <span class="loading-status">기록 매체 동기화</span>
            <span class="loading-percent">0%</span>
          </div>
          <button class="enter-title-button" type="button" data-action="enter-title" hidden>
            화면을 클릭하여 시작
          </button>
        </div>
      </section>

      <section class="screen title-screen" data-screen="title" aria-label="게임 타이틀 화면" hidden>
        <section class="title-interface" aria-label="심역록 시작 메뉴">
          <header class="title-lockup">
            <span class="title-flare" aria-hidden="true"></span>
            <h1 class="game-title">심역록</h1>
            <span class="title-rule" aria-hidden="true"></span>
          </header>

          <nav class="title-menu" aria-label="게임 메뉴">
            <button class="menu-button menu-button--primary" type="button" data-action="start">
              <span class="menu-marker" aria-hidden="true"></span>
              <span>시작하기</span>
            </button>
            <button class="menu-button" type="button" data-action="load">
              <span class="menu-marker" aria-hidden="true"></span>
              <span>불러오기</span>
            </button>
            <button class="menu-button" type="button" data-action="settings">
              <span class="menu-marker" aria-hidden="true"></span>
              <span>설정</span>
            </button>
          </nav>
        </section>

        <button class="audio-toggle" type="button" data-action="toggle-audio" aria-pressed="false">
          <span class="audio-icon" aria-hidden="true">♪</span>
          <span class="audio-label">BGM 재생</span>
        </button>
      </section>

      <section class="screen prologue-screen" data-screen="prologue" aria-label="도입 기록" hidden>
        <div class="record-sigil" aria-hidden="true">
          <span></span>
        </div>

        <section class="dialogue-panel" tabindex="0" aria-label="대화창">
          <header class="dialogue-header">
            <span class="signal-dot" aria-hidden="true"></span>
            <span>발신자 미상</span>
            <span class="dialogue-count" aria-hidden="true"></span>
          </header>

          <p class="dialogue-text" aria-live="polite"></p>

          <footer class="dialogue-footer">
            <span class="dialogue-guide">클릭 또는 Space / Enter</span>
            <span class="dialogue-caret" aria-hidden="true"></span>
          </footer>

          <button class="next-stage-button" type="button" data-action="appearance" hidden>
            외형 선택으로
          </button>
        </section>
      </section>

      <section class="screen appearance-screen" data-screen="appearance" aria-labelledby="appearance-title" hidden>
        <div class="appearance-scroll">
          <header class="choice-heading">
            <span class="choice-step">첫 번째 기록</span>
            <h2 id="appearance-title">외형 재작성</h2>
            <p>당신의 모습을 선택하십시오.</p>

            <div class="choice-progress" aria-live="polite">
              <span data-current-category>성별</span>
              <strong data-selection-progress>01 / 11</strong>
            </div>
          </header>

          <form class="appearance-form" aria-label="외형 선택">
            <div class="choice-groups" data-choice-groups></div>

            <footer class="choice-actions">
              <button class="return-button" type="button" data-action="return-title">타이틀로 돌아가기</button>
              <div class="choice-navigation">
                <button class="previous-appearance-button" type="button" data-action="previous-appearance" disabled>
                  이전
                </button>
                <button class="confirm-appearance-button" type="button" data-action="next-appearance" disabled>
                  다음
                </button>
              </div>
            </footer>
          </form>
        </div>
      </section>

    <audio
      id="title-bgm"
      src="https://raw.githubusercontent.com/9ki-cyoa/cyoa/main/media/title-bgm.mp3"
      crossorigin="anonymous"
      preload="auto"
      loop
    ></audio>
      <p class="status-message" role="status" aria-live="polite"></p>
    </main>

    <script src="./app.js?v=20261001-1"></script>
  </body>
</html>
