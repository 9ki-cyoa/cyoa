<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143e62" />
    <meta
      name="description"
      content="판타지 세계를 여행하는 CYOA 게임의 타이틀 화면"
    />
    <title>CYOA</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23102f4c' d='M7 8h50v48H7z'/%3E%3Cpath fill='%23f6d48c' d='M32 8 39 25l17 7-17 7-7 17-7-17-17-7 17-7z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="title-screen" aria-label="게임 타이틀 화면">
      <div class="light-wash" aria-hidden="true"></div>

      <nav class="title-menu" aria-label="게임 메뉴">
        <button class="menu-button menu-button--primary" type="button" data-action="start">
          <span>시작하기</span>
        </button>
        <button class="menu-button" type="button" data-action="load">
          <span>불러오기</span>
        </button>
        <button class="menu-button" type="button" data-action="settings">
          <span>설정</span>
        </button>
      </nav>

      <p class="status-message" role="status" aria-live="polite"></p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
